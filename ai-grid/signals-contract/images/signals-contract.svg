<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="g"   markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94A3B8"/></marker>
    <marker id="amb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#F59E0B"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>

  <!-- Peer sites: outside this site, so white fill + dashed band, tagged once -->
  <rect x="40" y="96" width="268" height="330" rx="6" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="56" y="124" font-size="13.5" font-weight="700" fill="#64748B">Peer sites</text>
  <rect x="206" y="104" width="86" height="22" rx="6" fill="#E2E8F0"/>
  <text x="249" y="119" font-size="11.5" fill="#475569" text-anchor="middle">external</text>

  <rect x="64" y="150" width="220" height="104" rx="6" fill="#ffffff" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="84" y="184" font-size="15" font-weight="700" fill="#92400E">Site B operator</text>
  <text x="84" y="210" font-size="12" fill="#B45309">Returns its own metrics,</text>
  <text x="84" y="230" font-size="12" fill="#B45309">never its peers'</text>

  <rect x="64" y="282" width="220" height="104" rx="6" fill="#ffffff" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="84" y="316" font-size="15" font-weight="700" fill="#92400E">Site C operator</text>
  <text x="84" y="342" font-size="12" fill="#B45309">Returns its own metrics,</text>
  <text x="84" y="362" font-size="12" fill="#B45309">never its peers'</text>

  <!-- Local operator: the authority -->
  <rect x="408" y="74" width="364" height="374" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
  <text x="432" y="108" font-size="17" font-weight="700" fill="#4338CA">Local operator</text>

  <rect x="432" y="130" width="316" height="62" rx="6" fill="#E0E7FF" stroke="#6366F1" stroke-width="1"/>
  <text x="452" y="155" font-size="13" font-weight="700" fill="#4338CA">Polls each peer</text>
  <text x="452" y="177" font-size="12" fill="#6366F1">One connection per site, mutual TLS</text>

  <!-- the argument: the label is set here -->
  <rect x="432" y="208" width="316" height="76" rx="6" fill="#10B981"/>
  <text x="452" y="238" font-size="15" font-weight="700" fill="#ffffff">Stamps the site label</text>
  <text x="452" y="264" font-size="12.5" fill="#D1FAE5">From the verified identity it dialed</text>

  <rect x="432" y="300" width="316" height="54" rx="6" fill="#E0E7FF" stroke="#6366F1" stroke-width="1"/>
  <text x="452" y="332" font-size="13" font-weight="700" fill="#4338CA">Refuses rows naming another site</text>

  <rect x="432" y="370" width="316" height="54" rx="6" fill="#E0E7FF" stroke="#6366F1" stroke-width="1"/>
  <text x="452" y="402" font-size="13" font-weight="700" fill="#4338CA">Serves every site on one endpoint</text>

  <!-- Gateway: one source -->
  <rect x="872" y="178" width="288" height="166" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="896" y="212" font-size="17" font-weight="700" fill="#1D4ED8">Grid gateway</text>
  <rect x="896" y="232" width="240" height="88" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="916" y="262" font-size="13" font-weight="700" fill="#1D4ED8">Polls one source</text>
  <text x="916" y="288" font-size="12" fill="#3B82F6">Its own operator, never</text>
  <text x="916" y="306" font-size="12" fill="#3B82F6">another site</text>

  <!-- peer data crosses the boundary inward: dashed, peer role colour -->
  <line x1="292" y1="202" x2="400" y2="202" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#amb)"/>
  <line x1="292" y1="334" x2="400" y2="334" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#amb)"/>

  <!-- the one hop the gateway makes -->
  <line x1="780" y1="261" x2="864" y2="261" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="822" y="248" font-size="12" font-weight="700" fill="#64748B" text-anchor="middle">all sites</text>
  <!-- version stamp -->
  <rect x="1004" y="488" width="176" height="20" rx="6" fill="#E2E8F0"/><text x="1092" y="502" font-size="12" fill="#475569" text-anchor="middle">RHOAI 3.6, AI Grid 0.3.0</text>
</svg>
