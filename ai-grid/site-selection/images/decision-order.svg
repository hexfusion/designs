  <text x="264" y="126" font-size="17"><tspan font-weight="700" fill="#0F172A">stored-state pin</tspan></text>
  <text x="442" y="126" font-size="15" fill="#64748B">a pinned id goes to its site</text>
  <rect x="200" y="158" width="600" height="50" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
