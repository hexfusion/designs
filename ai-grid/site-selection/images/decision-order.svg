  <text x="264" y="126" font-size="17"><tspan font-weight="700" fill="#0F172A">candidates</tspan></text>
  <text x="400" y="126" font-size="15" fill="#64748B">serve the model, in the fence, healthy, live</text>
  <rect x="200" y="158" width="600" height="50" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  <rect x="210" y="168" width="36" height="30" rx="6" fill="#10B981"/>
  <text x="228" y="188.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="264" y="189" font-size="17"><tspan font-weight="700" fill="#065F46">tier</tspan></text>
  <text x="400" y="189" font-size="15" fill="#64748B">room first, else overflow</text>
  <rect x="200" y="221" width="600" height="50" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
  <rect x="210" y="231" width="36" height="30" rx="6" fill="#10B981"/>
  <text x="228" y="251.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="264" y="252" font-size="17"><tspan font-weight="700" fill="#065F46">affinity</tspan></text>
  <text x="400" y="252" font-size="15" fill="#64748B">the site holding the prompt</text>
  <rect x="200" y="284" width="600" height="50" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="210" y="294" width="36" height="30" rx="6" fill="#E2E8F0"/>
  <text x="228" y="314.5" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">5</text>
