  <text x="264" y="567" font-size="17"><tspan font-weight="700" fill="#065F46">affinity narrows inside the tier</tspan></text>
  <rect x="200" y="599" width="600" height="50" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="210" y="609" width="36" height="30" rx="6" fill="#E2E8F0"/>
