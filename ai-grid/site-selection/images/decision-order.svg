  <rect x="210" y="672" width="36" height="30" rx="6" fill="#E2E8F0"/>
  <text x="228" y="692.5" font-size="15" font-weight="700" fill="#475569" text-anchor="middle">11</text>
  <text x="264" y="693" font-size="17"><tspan font-weight="700" fill="#0F172A">draw by count: 1, 2, or two choices</tspan></text>
  <path d="M822 473 H836 V586 H822" fill="none" stroke="#10B981" stroke-width="2.5"/>
  <line x1="836" y1="529.5" x2="848" y2="529.5" stroke="#10B981" stroke-width="2.5"/>
