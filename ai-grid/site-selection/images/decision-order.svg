  <text x="264" y="63" font-size="17"><tspan font-weight="700" fill="#0F172A">refuse or pin</tspan></text>
  <text x="400" y="63" font-size="15" fill="#64748B">fence, stored state, model, shed</text>
  <rect x="200" y="95" width="600" height="50" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
