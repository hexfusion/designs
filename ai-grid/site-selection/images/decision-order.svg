  <text x="400" y="315" font-size="15" fill="#64748B">two by capacity, keep the less saturated</text>
  <path d="M822 158 H836 V271 H822" fill="none" stroke="#10B981" stroke-width="2.5"/>
  <line x1="836" y1="214.5" x2="848" y2="214.5" stroke="#10B981" stroke-width="2.5"/>
