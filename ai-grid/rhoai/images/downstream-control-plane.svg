<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="Helvetica, Arial, sans-serif">
  <rect width="1240" height="690" fill="#ffffff"/>

  <defs>
    <marker id="ind" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6366F1"/></marker>
    <marker id="amb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#F59E0B"/></marker>
    <marker id="blu" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3B82F6"/></marker>
    <marker id="vio" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8B5CF6"/></marker>
  </defs>

  <!-- hub -->
  <rect x="30" y="40" width="230" height="600" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
  <text x="48" y="66" font-size="16" font-weight="700" fill="#0F172A">RHOAI hub</text>

  <rect x="46" y="80" width="198" height="172" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="60" y="102" font-size="14" font-weight="700" fill="#4338CA">grid-bootstrap</text>
  <rect x="60" y="114" width="170" height="36" rx="6" fill="#E0E7FF" stroke="#6366F1" stroke-width="1"/><text x="145" y="137" font-size="12.5" fill="#4338CA" text-anchor="middle">Grid CA (cert-manager)</text>
  <rect x="60" y="158" width="170" height="36" rx="6" fill="#E0E7FF" stroke="#6366F1" stroke-width="1"/><text x="145" y="181" font-size="12.5" fill="#4338CA" text-anchor="middle">Certificate per member</text>
  <rect x="60" y="202" width="170" height="36" rx="6" fill="#E0E7FF" stroke="#6366F1" stroke-width="1"/><text x="145" y="225" font-size="12.5" fill="#4338CA" text-anchor="middle">enrollment policies</text>

  <rect x="46" y="268" width="198" height="252" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="145" y="400" font-size="15" font-weight="700" fill="#4338CA" text-anchor="middle">ACM</text>

  <rect x="46" y="540" width="198" height="84" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="145" y="577" font-size="13" font-weight="700" fill="#4338CA" text-anchor="middle">Argo CD ApplicationSet</text>
  <text x="145" y="597" font-size="12" fill="#6366F1" text-anchor="middle">RHOAI per site</text>

  <!-- member site -->
  <rect x="540" y="40" width="560" height="600" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="558" y="66" font-size="16" font-weight="700" fill="#0F172A">member site</text>

  <!-- hub-delivered objects -->
  <rect x="556" y="240" width="164" height="374" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="570" y="262" font-size="13.5" font-weight="700" fill="#4338CA">from the hub</text>
  <g font-size="12.5" fill="#4338CA" text-anchor="middle">
    <rect x="568" y="282" width="140" height="36" rx="6" fill="#E0E7FF" stroke="#6366F1" stroke-width="1"/><text x="638" y="305">identity Secret</text>
    <rect x="568" y="332" width="140" height="36" rx="6" fill="#E0E7FF" stroke="#6366F1" stroke-width="1"/><text x="638" y="355">GridNetwork</text>
    <rect x="568" y="382" width="140" height="36" rx="6" fill="#E0E7FF" stroke="#6366F1" stroke-width="1"/><text x="638" y="405">operator ConfigMap</text>
    <rect x="568" y="432" width="140" height="36" rx="6" fill="#E0E7FF" stroke="#6366F1" stroke-width="1"/><text x="638" y="455">peer GridSites</text>
    <rect x="568" y="482" width="140" height="36" rx="6" fill="#E0E7FF" stroke="#6366F1" stroke-width="1"/><text x="638" y="505">GridSite</text>
    <rect x="568" y="562" width="140" height="36" rx="6" fill="#E0E7FF" stroke="#6366F1" stroke-width="1"/><text x="638" y="585">RHOAI install</text>
  </g>

  <!-- EPP metrics -->
  <rect x="752" y="84" width="148" height="40" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/><text x="826" y="109" font-size="12.5" fill="#1D4ED8" text-anchor="middle">EPP metrics :9090</text>

  <!-- grid operator -->
  <rect x="736" y="150" width="348" height="130" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="752" y="174" font-size="14" font-weight="700" fill="#92400E">grid operator</text>
  <rect x="752" y="190" width="148" height="70" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/><text x="826" y="230" font-size="13" fill="#92400E" text-anchor="middle">scraper</text>
  <rect x="916" y="190" width="152" height="70" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/><text x="992" y="221" font-size="13" fill="#92400E" text-anchor="middle">signals Service</text><text x="992" y="239" font-size="12.5" fill="#B45309" text-anchor="middle">(mTLS)</text>

  <!-- operator-written files -->
  <rect x="752" y="320" width="148" height="50" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/><text x="826" y="341" font-size="12.5" fill="#92400E" text-anchor="middle">serving ConfigMap</text><text x="826" y="359" font-size="12" fill="#B45309" text-anchor="middle">dial file</text>
  <rect x="916" y="320" width="152" height="50" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/><text x="992" y="350" font-size="12.5" fill="#92400E" text-anchor="middle">provider file</text>

  <!-- readers -->
  <rect x="752" y="410" width="148" height="40" rx="6" fill="#EEF2F7" stroke="#94A3B8" stroke-width="1"/><text x="826" y="435" font-size="12.5" fill="#0F172A" text-anchor="middle">grid gateway</text>
  <rect x="916" y="410" width="152" height="40" rx="6" fill="#EEF2F7" stroke="#94A3B8" stroke-width="1"/><text x="992" y="435" font-size="12.5" fill="#0F172A" text-anchor="middle">provider gateway</text>

  <!-- model controller -->
  <rect x="752" y="490" width="316" height="50" rx="6" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1"/><text x="910" y="511" font-size="13" fill="#6D28D9" text-anchor="middle">InferenceProviders</text><text x="910" y="529" font-size="12" fill="#7C3AED" text-anchor="middle">one per LLMInferenceService</text>
  <rect x="752" y="576" width="316" height="40" rx="6" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1"/><text x="910" y="601" font-size="12.5" fill="#6D28D9" text-anchor="middle">ODH model controller</text>

  <!-- peer site -->
  <rect x="1116" y="170" width="112" height="110" rx="6" fill="#ffffff" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1128" y="190" font-size="13" font-weight="700" fill="#334155">peer site</text>
  <rect x="1126" y="200" width="92" height="68" rx="6" fill="#ffffff" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="1172" y="230" font-size="12" fill="#92400E" text-anchor="middle">grid operator</text>
  <text x="1172" y="248" font-size="12" fill="#92400E" text-anchor="middle">signals</text>

  <!-- hub to member (ACM / Argo CD) -->
  <g stroke="#6366F1" stroke-width="2" stroke-dasharray="5 4" fill="none">
    <line x1="246" y1="300" x2="561" y2="300" marker-end="url(#ind)"/>
    <line x1="246" y1="350" x2="561" y2="350" marker-end="url(#ind)"/>
    <line x1="246" y1="400" x2="561" y2="400" marker-end="url(#ind)"/>
    <line x1="246" y1="450" x2="561" y2="450" marker-end="url(#ind)"/>
    <line x1="566" y1="500" x2="251" y2="500" marker-end="url(#ind)"/>
    <line x1="246" y1="580" x2="561" y2="580" marker-end="url(#ind)"/>
  </g>
  <rect x="284.5" y="289" width="239" height="22" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="1"/><text x="404" y="304" font-size="12" font-weight="700" fill="#4338CA" text-anchor="middle">site identity Secret + CA bundle</text>
  <rect x="284.5" y="339" width="239" height="22" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="1"/><text x="404" y="354" font-size="12" font-weight="700" fill="#4338CA" text-anchor="middle">Local, poll, peer trust, grid ID</text>
  <rect x="291.5" y="389" width="225" height="22" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="1"/><text x="404" y="404" font-size="12" font-weight="700" fill="#4338CA" text-anchor="middle">operator ConfigMap (site name)</text>
  <rect x="315.5" y="439" width="177" height="22" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="1"/><text x="404" y="454" font-size="12" font-weight="700" fill="#4338CA" text-anchor="middle">peer GridSites (copies)</text>
  <rect x="264" y="489" width="280" height="22" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="1"/><text x="404" y="504" font-size="12" font-weight="700" fill="#4338CA" text-anchor="middle">ManifestWork observer, status feedback</text>
  <rect x="298.5" y="569" width="211" height="22" rx="6" fill="#EEF2FF" stroke="#6366F1" stroke-width="1"/><text x="404" y="584" font-size="12" font-weight="700" fill="#4338CA" text-anchor="middle">RHOAI chart, profile by role</text>

  <!-- scrape -->
  <line x1="880" y1="126" x2="880" y2="183" stroke="#3B82F6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#blu)"/>
  <rect x="890" y="126" width="59" height="22" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/><text x="919.5" y="141" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">scrape</text>

  <!-- writes / reads -->
  <g stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 4">
    <line x1="826" y1="282" x2="826" y2="313" marker-end="url(#amb)"/>
    <line x1="992" y1="282" x2="992" y2="313" marker-end="url(#amb)"/>
    <line x1="826" y1="372" x2="826" y2="403" marker-end="url(#amb)"/>
    <line x1="992" y1="372" x2="992" y2="403" marker-end="url(#amb)"/>
  </g>
  <rect x="836" y="286" width="59" height="22" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/><text x="865.5" y="301" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">writes</text>
  <rect x="1002" y="286" width="59" height="22" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/><text x="1031.5" y="301" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">writes</text>
  <rect x="836" y="376" width="52" height="22" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/><text x="862" y="391" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">reads</text>
  <rect x="1002" y="376" width="52" height="22" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/><text x="1028" y="391" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">reads</text>

  <!-- peer polling -->
  <g stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 4">
    <line x1="1124" y1="214" x2="1075" y2="214" marker-end="url(#amb)"/>
    <line x1="1070" y1="252" x2="1119" y2="252" marker-end="url(#amb)"/>
  </g>
  <rect x="1128.5" y="144" width="87" height="22" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/><text x="1172" y="159" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">poll, mTLS</text>

  <!-- operator reads InferenceProviders -->
  <line x1="908" y1="488" x2="908" y2="288" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#amb)"/>
  <rect x="918" y="459" width="52" height="22" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/><text x="944" y="474" font-size="12" font-weight="700" fill="#92400E" text-anchor="middle">reads</text>

  <!-- model controller writes -->
  <line x1="910" y1="574" x2="910" y2="547" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#vio)"/>
  <rect x="920" y="547" width="59" height="22" rx="6" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1"/><text x="949.5" y="562" font-size="12" font-weight="700" fill="#6D28D9" text-anchor="middle">writes</text>

  <text x="820" y="668" font-size="13" font-style="italic" fill="#64748B" text-anchor="middle">membership = labels ai-grid/enabled and ai-grid/role</text>
  <!-- version stamp -->
  <rect x="1044" y="658" width="176" height="20" rx="6" fill="#E2E8F0"/><text x="1132" y="672" font-size="12" fill="#475569" text-anchor="middle">RHOAI 3.6, AI Grid 0.3.0</text>
</svg>
